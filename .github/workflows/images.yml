name: images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend,   context: backend,  file: backend/Dockerfile,  target: prod }
          - { name: frontend,  context: frontend, file: frontend/Dockerfile, target: prod }
          - { name: worker,    context: .,        file: workers/Dockerfile,  target: worker }
          - { name: scheduler, context: .,        file: workers/Dockerfile,  target: scheduler }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: NEXT_PUBLIC_API_URL=/api
          push: true
          tags: |
            ghcr.io/cilag/pole-emploi-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/cilag/pole-emploi-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
